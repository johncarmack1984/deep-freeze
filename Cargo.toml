[package]
name = "deep-freeze"
version = "0.9.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-recursion = "1.0.4"
aws-config = "1"
# The SDK defaults minus `rustls`, which only compiles in the legacy hyper 0.14 /
# rustls 0.21 client. BehaviorVersion::latest() already picks the hyper 1
# `default-https-client`, so the legacy one was never used. S3 also drops
# `sigv4a`, which only Multi-Region Access Points sign with.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = { version = "1", features = ["http-body-0-4-x"] }
clap = { version = "4.3.10", features = ["derive"] }
console = "0.15.7"
dotenv = "0.15.0"
futures = "0.3.28"
futures-util = "0.3.28"
hyper = { version = "0.14.27", features = ["stream"] }
indicatif = "0.17.5"
inquire = "0.6.2"
open = "4.1.0"
rand = "0.8.5"
reqwest = { version = "0.11.18", features = ["blocking", "json", "stream"] }
sedregex = "0.2.5"
serde_json = "1.0.97"
sqlite = "0.31.0"
tokio = { version ="1.28.2", features=["full"] }
